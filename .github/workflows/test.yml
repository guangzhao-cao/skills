name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        working-directory: skills/raspberry-pi-status
        run: >-
          shellcheck -s sh
          scripts/status.sh
          tests/smoke.sh
          tests/fixtures/mock-linux-bin/uname
          tests/fixtures/mock-linux-bin/vcgencmd

      - name: Run smoke test
        working-directory: skills/raspberry-pi-status
        run: sh tests/smoke.sh
