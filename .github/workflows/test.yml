name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: >-
          shellcheck -s sh
          skills/raspberry-pi-status/scripts/status.sh
          tests/raspberry-pi-status/smoke.sh
          tests/raspberry-pi-status/fixtures/mock-linux-bin/uname
          tests/raspberry-pi-status/fixtures/mock-linux-bin/vcgencmd

      - name: Run smoke test
        run: sh tests/raspberry-pi-status/smoke.sh
